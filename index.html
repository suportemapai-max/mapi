*{box-sizing:border-box}
html,body{height:100%}

svg{flex:none}

.lock{min-height:100%;display:grid;place-items:center;padding:24px}
.lockbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--sh);text-align:center}

.lockbox input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:10px}
.err{color:var(--bad);min-height:20px;margin:0 0 8px!important;font-size:13px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.lockbox .btn{width:100%;justify-content:center;padding:11px}
/* shell */

header{display:flex;gap:10px;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;margin-right:8px;white-space:nowrap}
.brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#6d4dff);color:#fff;display:grid;place-items:center}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;padding:10px 70px 10px 38px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);transition:border-color .12s,box-shadow .12s}

.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search kbd,.kbd{font:11px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.search .clr{position:absolute;right:34px;top:50%;transform:translateY(-50%)}
header .sp{flex:1}
.ib{border:0;background:transparent;color:var(--mut);padding:5px;border-radius:8px;display:inline-grid;place-items:center}

.perfil .row{grid-template-columns:120px 1fr}
.perfil a{color:var(--acc)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.nop{padding:12px 16px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item .t{min-width:0;flex:1}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dh{display:flex;gap:16px;align-items:center;margin-bottom:18px}

.back{display:none}
.quick{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh)}

.qbtn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 12px;display:inline-flex;gap:7px;align-items:center;font-size:13px;text-decoration:none;color:var(--tx)}
.qbtn:hover{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.qbtn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.qbtn.p:hover{filter:brightness(1.08);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.card h4{margin:0;padding:11px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}

.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:8px 16px;border-bottom:1px solid var(--line)}

.line{display:flex;gap:6px;align-items:center;min-height:28px}
.line+.line{border-top:1px dashed var(--line)}

.dots{letter-spacing:2px;color:var(--mut)}
.line .acts{display:flex;gap:2px;opacity:.55}

.empties{margin:2px 0 14px}
.note{padding:12px 16px}

.blur .body{filter:blur(6px);user-select:none;pointer-events:none}
.warnbar{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.kpi.b b{color:var(--bad)}.kpi.w b{color:var(--warn)}
.gl2{padding:11px 16px;border-bottom:1px solid var(--line)}.gl2:last-child{border-bottom:0}

  (r.campos || []).forEach((f, i) => { if (f.v && !f.p) (by[f.g] ||= []).push([i, f]); });
  const rows = [];
  [...GRP_ORDER, ...Object.keys(by).filter(g => !GRP_ORDER.includes(g))].forEach(g => {
    const fs = by[g]; if (!fs) return;
    const user = fs.find(([, f]) => !f.s && /usu[aá]rio|user|e-?mail|conta/i.test(f.l)), pw = fs.find(([, f]) => f.s);
    const host = fs.find(([, f]) => !f.s && /^(ip|id|conex)/i.test(f.l));
    if (!user && !pw && !host) return;
    const btn = (x, label, p) => x ? `<button class="qbtn ${p ? 'p' : ''}" data-a="copy" data-r="${r.id}" data-f="${x[0]}" data-l="0">${I('copy', 14)}${label}</button>` : '';
    let extra = '';
    if (g === 'AnyDesk' && host) { const id = host[1].v.replace(/\D/g, ' ').trim().split(/\s{2,}|\n/)[0].replace(/\s+/g, ''); if (id.length >= 7) extra = `<a class="qbtn" href="anydesk:${id}" title="Abre o AnyDesk instalado">${I('remote', 14)}Conectar</a>`; }
    const [ic, col] = gi(g);
    rows.push(`<div class="qrow"><span class="gl" style="color:var(${col})">${I(ic, 16)}${esc(g)}</span>${btn(host, host && /^id/i.test(host[1].l) ? 'Copiar ID' : 'Copiar endereço', false)}${btn(user, 'Copiar usuário', false)}${btn(pw, pw && /chave/i.test(pw[1].l) ? 'Copiar chave' : 'Copiar senha', true)}${extra}</div>`);
  });
  return rows.length ? `<div class="quick"><h5>Acesso rápido</h5>${rows.join('')}</div>` : '';
}
function detailHtml(r) {

  const order = [...GRP_ORDER, ...Object.keys(groups).filter(g => !GRP_ORDER.includes(g))].filter(g => groups[g]);
  const cards = order.map(g => { const [ic, col] = gi(g); return `<div class="card" style="--gc:var(${col})"><h4>${I(ic, 16)}${esc(g)}</h4>${groups[g].map(([i, f]) =>

    ${nEmpty ? `<div class="empties"><button class="btn sm" data-a="empties" data-v="${r.id}">${showE ? 'Ocultar' : 'Mostrar'} ${nEmpty} campo${nEmpty > 1 ? 's' : ''} sem dados</button></div>` : ''}

function copy(text, label) {
  const done = () => { toast((label || 'Copiado') + ' · área de transferência limpa em 30 s'); clearTimeout(S.clip); S.clip = setTimeout(() => navigator.clipboard.writeText(' ').catch(() => {}), CLIP_MS); };
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(done).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('Não foi possível copiar'); } ta.remove();
  });
}
function download(name, content, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function exportHtml() {
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML = ''; c.querySelector('#vault-blob').textContent = JSON.stringify(S.blob || embedded());
  c.querySelectorAll('.toast,dialog').forEach(n => n.remove());
  download(`cofre-acessos-${stamp()}.html`, '<!doctype html>\n' + c.outerHTML, 'text/html'); S.dirty = false; toast('Arquivo atualizado baixado');
}
function exportCsv() {
  if (!confirm('O CSV contém TODAS as senhas em texto puro. Guarde com cuidado e apague depois. Continuar?')) return;
  logEv('exportar', null, 'CSV completo');
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Categoria','Registro','Detalhe','Grupo','Campo','Valor']];
  S.recs.forEach(r => { (r.campos || []).forEach(f => f.v && rows.push([r.cat, r.titulo, r.sub, f.g, f.l, f.v])); (r.anot || []).forEach(l => rows.push([r.cat, r.titulo, r.sub, 'Texto livre', '', l])); });
  download(`acessos-${stamp()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv');
}
async function changePw() {
  const a = prompt('Nova senha mestra (mínimo 12 caracteres):'); if (a == null) return;
  if (a.length < 12) return toast('Use pelo menos 12 caracteres');
  if (prompt('Repita a nova senha:') !== a) return toast('As senhas não conferem');
  S.salt = crypto.getRandomValues(new Uint8Array(16)); S.iter = 600000; S.key = await deriveKey(a, S.salt, S.iter); await persist();
  toast('Senha alterada. Baixe o cofre atualizado para fixá-la no arquivo.');
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]');
  if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); }
  if (!t || !S.unlocked) return;
  const a = t.dataset.a, v = t.dataset.v, keep = () => { const y = $('#det')?.scrollTop, l = $('#lst')?.scrollTop; render(); if ($('#det') && y) $('#det').scrollTop = y; if ($('#lst') && l) $('#lst').scrollTop = l; };
  if (a === 'cat') { S.cat = v; S.sel = null; S.mob = false; render(); }
  else if (a === 'sel') { select(v); S._noscroll = true; keep(); S._noscroll = false; if ($('#det')) $('#det').scrollTop = 0; }
  else if (a === 'back') { S.mob = false; render(); }
  else if (a === 'goto') { S.cat = 'Todos'; S.q = ''; select(v); render(); }
  else if (a === 'rev') { if (!S.rev.has(v)) logReveal(v); S.rev.has(v) ? S.rev.delete(v) : S.rev.add(v); keep(); }
  else if (a === 'empties') { S.empties.has(v) ? S.empties.delete(v) : S.empties.add(v); keep(); }
  else if (a === 'pin') { S.pins.has(v) ? S.pins.delete(v) : S.pins.add(v); savePrefs(); toast(S.pins.has(v) ? 'Fixado no topo da lista' : 'Removido dos fixados'); keep(); }
  else if (a === 'clr') { S.q = ''; S.sel = null; render(); $('#q').focus(); }
  else if (a === 'theme') { S.theme = {auto:'light', light:'dark', dark:'auto'}[S.theme]; applyTheme(); savePrefs(); toast('Tema: ' + {auto:'automático', light:'claro', dark:'escuro'}[S.theme]); render(); }
  else if (a === 'copy') { const r = S.recs.find(x => x.id === t.dataset.r), f = r.campos[+t.dataset.f];
    logCopy(r.id, f.l); copy(f.v.split('\n').map(x => x.trim()).filter(Boolean)[+t.dataset.l], f.l + ' copiado'); }
  else if (a === 'copyall') { logCopy(v, 'texto livre completo'); copy(S.recs.find(x => x.id === v).anot.join('\n'), 'Texto completo copiado'); }
  else if (a === 'copyline') { logCopy(S.sel, 'linha do texto livre'); const m = t.dataset.l.match(/[:：]\s*(\S.*)$/); copy(m ? m[1].trim() : t.dataset.l, 'Linha copiada'); }
  else if (a === 'menu') { S.menu = !S.menu; render(); e.stopPropagation(); }
  else if (a === 'logos') { S.logos = !S.logos; savePrefs(); S.menu = false; toast(S.logos ? 'Logos ligadas' : 'Logos desligadas'); render(); }
  else if (a === 'shortcuts') { S.menu = false; render(); shortcuts(); }
  else if (a === 'lock') lock();
  else if (a === 'new') openEditor(null);
  else if (a === 'edit') openEditor(v);
  else if (a === 'exphtml') { S.menu = false; render(); exportHtml(); }
  else if (a === 'expjson') { S.menu = false; render(); download(`cofre-backup-${stamp()}.json`, JSON.stringify(S.blob || embedded()), 'application/json'); }
  else if (a === 'impjson') { S.menu = false; render(); onFile('.json', async txt => {
      const p = prompt('Senha mestra do backup:'); if (!p) return;
      try { const o = await openBlob(JSON.parse(txt), p); if (!confirm(`Substituir o cofre atual por ${o.data.length} registros do backup?`)) return;
        Object.assign(S, {recs:o.data, key:o.key, salt:o.salt, iter:o.iter}); await persist(); S.sel = null; render(); toast('Backup restaurado'); }
      catch { toast('Backup inválido ou senha incorreta'); } }); }
  else if (a === 'expcsv') { S.menu = false; render(); exportCsv(); }
  else if (a === 'chpw') { S.menu = false; render(); changePw(); }
  else if (a === 'reset') { S.menu = false; if (confirm('Descartar edições feitas neste navegador e voltar ao conteúdo do arquivo?')) { localStorage.removeItem(LS); if (AUTO) location.reload(); else lock('Edições locais descartadas.'); } else render(); }
});
document.addEventListener('keydown', e => {
  if (!S.unlocked || $('dialog[open]')) return;
  const tag = document.activeElement.tagName, typing = /INPUT|TEXTAREA|SELECT/.test(tag);
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); $('#q')?.focus(); $('#q')?.select(); return; }
  if (e.key === 'Escape') { if (S.menu) { S.menu = false; render(); } else if (S.q) { S.q = ''; S.sel = null; render(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (S.cat === 'Auditoria' || (typing && document.activeElement.id !== 'q')) return;
    const list = visible(); if (!list.length) return; e.preventDefault();
    let i = list.findIndex(r => r.id === S.sel); i = Math.max(0, Math.min(list.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    S.sel = list[i].id; S.recent = [S.sel, ...S.recent.filter(x => x !== S.sel)].slice(0, 8); const l = $('#lst')?.scrollTop; render(); if ($('#lst')) $('#lst').scrollTop = l; return;
  }
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === 'n' && canWrite()) { e.preventDefault(); openEditor(null); }
  else if (k === 'e' && S.sel && canWrite()) { e.preventDefault(); openEditor(S.sel); }
  else if (k === 'p' && S.sel) { S.pins.has(S.sel) ? S.pins.delete(S.sel) : S.pins.add(S.sel); savePrefs(); render(); }
  else if (e.key === '?') shortcuts();
});
addEventListener('beforeunload', e => { if (S.unlocked && S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- editor ---------- */
function openEditor(id) {
  if (!canWrite()) return toast('Seu perfil é somente leitura');
  const r = id ? JSON.parse(JSON.stringify(S.recs.find(x => x.id === id))) : {id:'r' + Date.now().toString(36), cat:'Cliente', titulo:'', sub:'', campos:[], tags:[], nota:''};
  const isNote = r.cat === 'Anotação' || !!r.anot;
  let d = $('#dlg'); if (!d) { d = document.createElement('dialog'); d.id = 'dlg'; document.body.append(d); }
  const frow = f => `<div class="fr"><input data-k="g" placeholder="Grupo" value="${esc(f.g || '')}" list="grps"><input data-k="l" placeholder="Campo" value="${esc(f.l)}">
    <input data-k="v" placeholder="Valor" value="${esc(f.v)}" ${f.s ? 'type="password"' : ''}><label style="font-size:12px"><input type="checkbox" data-k="s" ${f.s ? 'checked' : ''}> secreto</label>
    <button type="button" class="ib" data-rm title="Remover">${I('x', 15)}</button></div>`;
  d.innerHTML = `<form class="dlg" method="dialog" autocomplete="off"><h3>${id ? 'Editar registro' : 'Novo registro'}</h3>
    <div class="two"><div class="f"><label>Nome</label><input name="titulo" required value="${esc(r.titulo)}"></div>
    <div class="f"><label>Categoria</label><select name="cat">${['Cliente','Interno','Equipe','Anotação'].map(c => `<option ${c === r.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>
    <div class="f"><label>Detalhe (tipo de servidor, setor…)</label><input name="sub" value="${esc(r.sub || '')}"></div>
    ${r.cat === 'Cliente' || r.perfil ? `<div class="two"><div class="f"><label>Site (domínio, ex.: empresa.com.br)</label><input name="dom" value="${esc(r.perfil?.dom || '')}"></div>
    <div class="f"><label>Cidade / UF</label><input name="local" value="${esc(r.perfil?.local || '')}"></div></div>
    <div class="f"><label>Segmento</label><input name="seg" value="${esc(r.perfil?.seg || '')}"></div>
    <div class="f"><label>Resumo da empresa</label><input name="resumo" value="${esc(r.perfil?.resumo || '')}"></div>` : ''}
    <datalist id="grps">${GRP_ORDER.map(g => `<option value="${g}">`).join('')}</datalist>
    ${isNote ? `<div class="f"><label>Texto livre (uma linha por entrada)</label><textarea name="anot">${esc((r.anot || []).join('\n'))}</textarea></div>` :
    `<label style="font-size:12px;color:var(--mut)">Campos</label><div id="frs">${(r.campos || []).map(frow).join('')}</div>
     <button type="button" class="btn sm" id="addf">+ Campo</button>`}
    <div class="f" style="margin-top:12px"><label>Observações</label><textarea name="nota" style="min-height:70px">${esc(r.nota || '')}</textarea></div>
    <div class="acts2">${id && (!SERVER || isAdmin()) ? '<button type="button" class="btn danger" id="del" style="margin-right:auto">Excluir</button>' : ''}
    <button type="button" class="btn" id="cancel">Cancelar</button><button class="btn pri" value="ok">Salvar</button></div></form>`;
  const form = $('form', d);
  d.addEventListener('click', ev => { if (ev.target.closest('[data-rm]')) ev.target.closest('.fr').remove(); });
  d.addEventListener('change', ev => { if (ev.target.dataset.k === 's') { ev.target.closest('.fr').querySelector('[data-k=v]').type = ev.target.checked ? 'password' : 'text'; } });
  $('#addf', d)?.addEventListener('click', () => $('#frs', d).insertAdjacentHTML('beforeend', frow({g:'', l:'', v:'', s:false})));
  $('#cancel', d).onclick = () => d.close();
  $('#del', d)?.addEventListener('click', async () => {
    if (!confirm(`Excluir “${r.titulo}”? Isso não pode ser desfeito (a menos que exista um backup).`)) return;
    try { await dropRec(r.id); } catch { return; } S.recs = S.recs.filter(x => x.id !== r.id); S.sel = null; d.close(); render(); toast('Registro excluído');
  });
  form.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(form);
    r.titulo = fd.get('titulo').trim();
    if (fd.has('dom')) { const pf = r.perfil || {conf:'', fontes:[]}; pf.dom = fd.get('dom').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, ''); pf.local = fd.get('local').trim(); pf.seg = fd.get('seg').trim(); pf.resumo = fd.get('resumo').trim();
      if (!pf.conf) pf.conf = 'confirmado'; r.perfil = (pf.dom || pf.local || pf.seg || pf.resumo) ? pf : undefined; } r.cat = fd.get('cat'); r.sub = fd.get('sub').trim(); r.nota = fd.get('nota').trim();
    if (isNote) { r.anot = fd.get('anot').split('\n').map(x => x.trimEnd()).filter(x => x.trim()); }
    else r.campos = [...d.querySelectorAll('.fr')].map(row => {
      const g = k => row.querySelector(`[data-k=${k}]`);
      const old = (r.campos || []).find(f => f.l === g('l').value.trim() && f.g === g('g').value.trim());
      return {g:g('g').value.trim() || 'Acesso', l:g('l').value.trim(), v:g('v').value, s:g('s').checked, ...(old?.p && !g('v').value ? {p:true} : {})};
    }).filter(f => f.l);
    r.tags = (r.tags || []).filter(t => t !== 'revisar' || isNote);
    const i = S.recs.findIndex(x => x.id === r.id); i >= 0 ? S.recs[i] = r : S.recs.push(r);
    S.sel = r.id; try { await persistRec(r); } catch { render(); return; } d.close(); render(); toast('Salvo');
  };
  d.showModal();
}

const CFG_LS = 'cofre_map_cfg', SESS_LS = 'cofre_map_sess', KS = 'cofre_map_ks';
const cfg = (() => { try { const c = JSON.parse(localStorage.getItem(CFG_LS)); if (c && c.url && c.key) return c; } catch {} return CFG0; })();
const SERVER = !!(cfg.url && cfg.key);
const VIEW = location.hash.match(/^#\/v\/([0-9a-f-]{36})\.([A-Za-z0-9_-]{20,})$/i);
const b64u = u8 => b64e(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64ud = s => b64d(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));

const ERR = {
  sem_acesso:'Sua conta ainda não foi liberada pelo administrador.', somente_admin:'Apenas administradores podem fazer isso.',
  sem_permissao_escrita:'Seu perfil não permite alterar dados.', sem_permissao_registro:'Você não tem permissão para este registro.',
  link_invalido:'Link inválido, expirado ou cancelado.', nao_pode_rebaixar_a_si_mesmo:'Você não pode retirar seu próprio acesso de administrador.',
  expiracao_invalida:'Validade inválida (máximo de 30 dias).', ja_configurado:'O cofre já foi configurado.',
  'Invalid login credentials':'E-mail ou senha incorretos.', 'Email not confirmed':'Confirme seu e-mail antes de entrar (veja a caixa de entrada).',
  'User already registered':'Este e-mail já possui cadastro.', link_inexistente:'Link não encontrado.'
};
const errMsg = e => e instanceof TypeError ? 'Sem conexão com o servidor.' : (ERR[e?.message] || e?.message || 'Erro inesperado.');

const SB = {
  sess:null,
  load() { try { this.sess = JSON.parse(localStorage.getItem(SESS_LS)); } catch { this.sess = null; } },
  save(s) { this.sess = s; try { s ? localStorage.setItem(SESS_LS, JSON.stringify(s)) : localStorage.removeItem(SESS_LS); } catch {} },
  async raw(path, o = {}) {
    const h = {apikey:cfg.key, 'Content-Type':'application/json', Authorization:'Bearer ' + (o.token || cfg.key)};
    const r = await fetch(cfg.url.replace(/\/+$/, '') + path, {method:o.method || 'POST', headers:h, body:o.body === undefined ? undefined : JSON.stringify(o.body)});
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
    if (!r.ok) { const e = new Error(j?.message || j?.msg || j?.error_description || j?.error || r.statusText); e.status = r.status; throw e; }
    return j;
  },
  async token() {
    const s = this.sess; if (!s) throw new Error('sem_acesso');
    if (s.expires_at * 1000 - Date.now() < 60000) {
      try { const j = await this.raw('/auth/v1/token?grant_type=refresh_token', {body:{refresh_token:s.refresh_token}}); this.save(this.fromAuth(j, s.email)); }
      catch (e) { if (e.status && e.status < 500) { this.save(null); } throw e; }
    }
    return this.sess.access_token;
  },
  fromAuth(j, email) { return {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email:j.user?.email || email}; },
  async rpc(fn, args = {}) { return this.raw('/rest/v1/rpc/' + fn, {body:args, token:await this.token()}); },
  anon(fn, args = {}) { return this.raw('/rest/v1/rpc/' + fn, {body:args}); },
  async login(email, password) { const j = await this.raw('/auth/v1/token?grant_type=password', {body:{email, password}}); this.save(this.fromAuth(j, email)); },
  async signup(email, password, nome) {
    const j = await this.raw('/auth/v1/signup', {body:{email, password, data:{nome}}});
    if (j?.access_token) { this.save(this.fromAuth(j, email)); return true; } return false;
  },
  recover(email) { return this.raw('/auth/v1/recover', {body:{email}}); }
};

/* ---------- criptografia dos registros (AES-GCM; id do registro vira dado autenticado) ---------- */
async function sealRec(key, obj, aad) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), p = {name:'AES-GCM', iv}; if (aad) p.additionalData = TE.encode(aad);
  return {iv:b64e(iv), ct:b64e(new Uint8Array(await crypto.subtle.encrypt(p, key, TE.encode(JSON.stringify(obj)))))};
}
async function openRec(key, blob, aad) {
  const p = {name:'AES-GCM', iv:b64d(blob.iv)}; if (aad) p.additionalData = TE.encode(aad);
  return JSON.parse(TD.decode(await crypto.subtle.decrypt(p, key, b64d(blob.ct))));
}

function renderSetup() {
  $('#app').innerHTML = shell(`<form id="sf" autocomplete="off"><div class="ic">${I('shield', 26)}</div><h1>Configurar o cofre</h1>
    <p>Você é o administrador. Defina a <b>chave do cofre</b>: ela criptografa tudo e será pedida a cada pessoa da equipe. Se for perdida, os dados não podem ser recuperados.</p>
    <input type="password" id="k1" placeholder="Chave do cofre (mínimo 12 caracteres)" autocomplete="new-password"><input type="password" id="k2" placeholder="Repita a chave" autocomplete="new-password">
    <p class="err" id="er"></p><button class="btn pri" id="go">Criar cofre</button><div class="alts"><button type="button" class="alt" id="so2">Sair da conta</button></div></form>`);
  $('#so2').onclick = srvLogout;
  $('#sf').onsubmit = async e => {
    e.preventDefault(); const a = $('#k1').value, b = $('#k2').value, er = $('#er');

    $('#go').disabled = true; $('#go').textContent = 'Criando…';
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(a, salt, 600000);
      await SB.rpc('configurar_cofre', {p_salt:b64e(salt), p_verificador:await sealRec(key, 'cofre-map-ok', 'verificador')});
      await bootServer(true, a);
    } catch (err) { $('#go').disabled = false; $('#go').textContent = 'Criar cofre'; er.textContent = errMsg(err); }
  };
}

async function bootServer(fresh, passHint) {
  SB.load();
  if (!SB.sess) return renderAuth();
  try { S.me = await SB.rpc('meu_perfil'); } catch (e) { return renderAuth(errMsg(e)); }
  if (!S.me) { SB.save(null); return renderAuth('Perfil não encontrado.'); }
  if (!S.me.ativo) return renderMsg('Aguardando liberação', 'Sua conta foi criada, mas um administrador ainda precisa liberar o acesso. Avise a equipe responsável.');
  try { S.srvcfg = await SB.rpc('config_cofre'); } catch (e) { return renderMsg('Erro', errMsg(e)); }
  if (!S.srvcfg) return S.me.papel === 'admin' ? renderSetup() : renderMsg('Cofre ainda não configurado', 'O administrador precisa concluir a configuração inicial.');
  if (fresh) logEv('login');
  const ks = passHint || sessionStorage.getItem(KS);
  if (ks) { try { await unlockWith(ks); return; } catch { sessionStorage.removeItem(KS); } }
  renderKeyPrompt();
}
async function unlockWith(pass) {
  const key = await deriveKey(pass, b64d(S.srvcfg.salt), 600000);
  try { if (await openRec(key, S.srvcfg.verificador, 'verificador') !== 'cofre-map-ok') throw 0; } catch { throw new Error('chave'); }
  S.key = key; try { sessionStorage.setItem(KS, pass); } catch {}
  await reloadRecs();
  Object.assign(S, {unlocked:true, cat:'Todos', sel:null, dirty:false, _lastOpen:null}); bump(); render();
  if (isAdmin() && !S.recs.length) offerImport();
}
async function reloadRecs() {
  const rows = await SB.rpc('carregar_registros');
  S.recs = await Promise.all(rows.map(async r => {
    try { return {...(await openRec(S.key, r.blob, r.id)), id:r.id, cat:r.cat, titulo:r.titulo}; }
    catch { return {id:r.id, cat:r.cat, titulo:r.titulo, sub:'', campos:[], tags:['revisar'], nota:'Não foi possível descriptografar este registro (chave diferente ou dado corrompido).'}; }
  }));
  S.ru = null;
}
function lockSrv(msg) {
  logEv('bloqueio');
  S.recs = []; S.key = null; S.unlocked = false; S.rev.clear(); S.sel = null; S.q = ''; S.menu = false; S.ru = null; sessionStorage.removeItem(KS);
  const d = $('#dlg'); if (d && d.open) d.close(); renderKeyPrompt(msg);
}

/* ---------- gravação ---------- */
async function persistRec(r) {
  if (!SERVER) return persist();
  try { await SB.rpc('salvar_registro', {p_id:r.id, p_cat:r.cat, p_titulo:r.titulo, p_blob:await sealRec(S.key, r, r.id)}); }
  catch (e) { toast(errMsg(e)); await reloadRecs().catch(() => {}); throw e; }
}
async function dropRec(id) {
  if (!SERVER) return persist();
  try { await SB.rpc('excluir_registro', {p_id:id}); } catch (e) { toast(errMsg(e)); await reloadRecs().catch(() => {}); throw e; }
}
function legacyBlobs() { return [localBlob(), (() => { try { const b = embedded(); return b && b.ct ? b : null; } catch { return null; } })()].filter(Boolean).sort((x, y) => (y.ts || 0) - (x.ts || 0)); }
async function legacyData() { for (const b of legacyBlobs()) { try { return (await openBlob(b, AUTO)).data; } catch {} } return null; }
async function offerImport() {
  if (!AUTO || !legacyBlobs().length) return;
  const data = await legacyData(); if (!data) return;
  if (!confirm(`Este arquivo contém ${data.length} registros do cofre antigo. Importar para o servidor agora (criptografados com a chave do cofre)?`)) return;
  await importLegacy(data);
}
async function importLegacy(data) {
  const items = await Promise.all(data.map(async r => ({id:r.id, cat:r.cat, titulo:r.titulo, blob:await sealRec(S.key, r, r.id)})));
  const n = await SB.rpc('importar_registros', {p_itens:items}); await reloadRecs(); render(); toast(`${n} registros importados`);
}

    ${linkBase() ? '' : '<div class="warnbox">Defina a “URL pública do cofre” em <b>Configuração do servidor</b> (a página precisa estar hospedada para quem recebe o link conseguir abrir).</div>'}
    <div class="f"><label>O que compartilhar</label><div class="chk">${items.map(it => `<label><input type="checkbox" data-it="${it.k}" checked> ${esc(it.t)} ${it.s ? '<span class="chip w">secreto</span>' : ''}</label>`).join('')}</div></div>
    <div class="two"><div class="f"><label>Link válido por</label>${sel('sh-exp', [['15', '15 minutos'], ['60', '1 hora'], ['240', '4 horas'], ['1440', '24 horas'], ['4320', '3 dias'], ['10080', '7 dias']], '60')}</div>
    <div class="f"><label>Número de aberturas</label>${sel('sh-max', [['1', '1 vez'], ['2', '2 vezes'], ['3', '3 vezes'], ['5', '5 vezes'], ['10', '10 vezes'], ['0', 'Sem limite (até expirar)']], '1')}</div></div>
    <div class="f"><label>Tempo de visualização depois de aberto</label>${sel('sh-vis', [['60', '1 minuto'], ['120', '2 minutos'], ['300', '5 minutos'], ['600', '10 minutos'], ['1800', '30 minutos']], '120')}</div>
    <div id="sh-out"></div>
    <div class="acts2"><button class="btn" onclick="this.closest('dialog').close()">Fechar</button><button class="btn pri" data-sv="mklink" data-v="${esc(rid)}">${I('link', 15)} Gerar link</button></div>
    <h5 style="margin:18px 0 6px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em">Links deste registro</h5><div id="sh-list">Carregando…</div></div>`);
  refreshLinkList(rid);
}
async function refreshLinkList(rid, targetId = 'sh-list') {
  const box = $('#' + targetId); if (!box) return;
  let ls; try { ls = await SB.rpc('listar_links', {p_registro:rid || null}); } catch (e) { box.textContent = errMsg(e); return; }
  box.innerHTML = ls.length ? `<div class="tw"><table class="tbl"><thead><tr>${rid ? '' : '<th>Registro</th>'}<th>Criado</th><th>Por</th><th>Expira</th><th>Aberturas</th><th>Estado</th><th></th></tr></thead><tbody>
    ${ls.map(l => `<tr>${rid ? '' : `<td>${esc(l.titulo)}</td>`}<td>${fdt(l.criado_em)}</td><td>${esc(l.criado_por || '')}</td><td>${fdt(l.expira_em)}</td><td>${l.views}${l.max_views ? ' / ' + l.max_views : ''}</td>
    <td><span class="chip ${STC[l.status]}">${l.status}</span></td><td>${l.status === 'ativo' ? `<button class="btn sm danger" data-sv="revoke" data-v="${l.id}" data-r="${esc(rid || '')}">Cancelar acesso</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p style="color:var(--mut);margin:0">Nenhum link criado.</p>';
}
async function makeLink(rid) {
  const r = S.recs.find(x => x.id === rid), d = $('#dlg'), out = $('#sh-out');
  if (!linkBase()) return toast('Defina a URL pública do cofre primeiro');
  const on = new Set([...d.querySelectorAll('[data-it]:checked')].map(x => x.dataset.it));
  if (!on.size) return toast('Marque pelo menos um item');
  const payload = {titulo:r.titulo, campos:(r.campos || []).filter((f, i) => on.has('c' + i)).map(f => ({g:f.g, l:f.l, v:f.v, s:!!f.s})),
    anot:on.has('anot') ? r.anot : undefined, anotTitulo:on.has('anot') ? r.anotTitulo : undefined, nota:on.has('nota') ? r.nota : undefined};
  const raw = crypto.getRandomValues(new Uint8Array(32)), key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const blob = await sealRec(key, payload);
  try {
    const id = await SB.rpc('criar_link', {p_registro:rid, p_blob:blob, p_expira:new Date(Date.now() + (+$('#sh-exp').value) * 60000).toISOString(), p_max:+$('#sh-max').value, p_visualizacao:+$('#sh-vis').value});
    const url = `${linkBase()}#/v/${id}.${b64u(raw)}`;
    out.innerHTML = `<div class="linkok"><b>Link criado.</b> Copie agora: a chave de leitura não é guardada em lugar nenhum.<div class="lrow"><input readonly id="lurl" value="${esc(url)}"><button class="btn sm pri" data-sv="cplink">${I('copy', 14)} Copiar</button></div></div>`;
    $('#lurl').select(); refreshLinkList(rid);
  } catch (e) { toast(errMsg(e)); }
}
async function openAllLinks() {
  dlgOpen(`<div class="dlg"><h3>Links compartilhados</h3><div id="all-links">Carregando…</div><div class="acts2"><button class="btn pri" onclick="this.closest('dialog').close()">Fechar</button></div></div>`, true);
  refreshLinkList(null, 'all-links');
}

/* ---------- configuração do servidor ---------- */
function openCfg() {
  dlgOpen(`<form class="dlg" method="dialog" autocomplete="off"><h3>Configuração do servidor</h3>
    <p style="color:var(--mut);margin:-8px 0 12px">Supabase: Project Settings → API. Use a <b>URL</b> e a chave <b>anon / publishable</b> (nunca a service_role).</p>
    <div class="f"><label>URL do projeto</label><input id="c-url" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url || '')}"></div>
    <div class="f"><label>Chave anon (pública)</label><input id="c-key" value="${esc(cfg.key || '')}"></div>
    <div class="f"><label>URL pública deste cofre (para os links compartilhados)</label><input id="c-base" placeholder="https://cofre.suaempresa.com.br/" value="${esc(cfg.base || '')}"></div>
    <div class="acts2">${SERVER ? '<button type="button" class="btn danger" data-sv="cfgoff" style="margin-right:auto">Desconectar</button>' : ''}<button type="button" class="btn" onclick="this.closest('dialog').close()">Cancelar</button><button type="button" class="btn pri" data-sv="cfgsave">Salvar e recarregar</button></div></form>`);
}
function saveCfg() {
  const url = $('#c-url').value.trim().replace(/\/+$/, ''), key = $('#c-key').value.trim(), base = $('#c-base').value.trim();
  if (!/^https:\/\/[^ ]+$/.test(url) || key.length < 20) return toast('Informe a URL (https://…) e a chave anon');
  try { if (/service_role/.test(atob((key.split('.')[1] || '').replace(/-/g, '+').replace(/_/g, '/')))) return toast('Essa é a chave service_role. Use a anon/publishable.'); } catch {}
  localStorage.setItem(CFG_LS, JSON.stringify({url, key, base})); location.reload();
}
function exportClean() {
  if (!confirm('Gerar uma cópia do aplicativo SEM os dados antigos (nem a senha embutida), já com a configuração do servidor. É essa cópia que deve ser distribuída para a equipe e hospedada. Continuar?')) return;
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML = ''; c.querySelector('#vault-blob').textContent = '{}'; c.querySelectorAll('.toast,dialog').forEach(n => n.remove());
  let h = '<!doctype html>\n' + c.outerHTML;
  h = h.replace(/const AUTO = '[^']*';/, "const AUTO = '';").replace(/const CFG0 = \{[^}]*\};/, 'const CFG0 = ' + JSON.stringify({url:cfg.url, key:cfg.key, base:cfg.base || ''}) + ';');
  download('cofre-acessos-map-limpo.html', h, 'text/html'); logEv('exportar', null, 'arquivo limpo');
}

/* ---------- visualização por link (sem login) ---------- */
async function bootViewer(id, k) {
  document.title = 'Acesso compartilhado';
  const end = (msg, ic = 'lock') => { clearInterval(window._vt); clearInterval(window._vp); $('#app').innerHTML = shell(`<div class="ic">${I(ic, 26)}</div><h1>Acesso encerrado</h1><p>${esc(msg)}</p>`); };
  if (!SERVER) return end('Este aplicativo ainda não está conectado ao servidor.');
  $('#app').innerHTML = shell('<div class="ic">' + I('lock', 26) + '</div><h1>Abrindo acesso…</h1>');
  let res, data;
  try { res = await SB.anon('abrir_link', {p_id:id}); } catch { return end('Este link expirou, foi cancelado ou atingiu o limite de aberturas.'); }
  try { const key = await crypto.subtle.importKey('raw', b64ud(k), 'AES-GCM', false, ['decrypt']); data = await openRec(key, res.blob); }
  catch { return end('Não foi possível ler o conteúdo: a chave no link está incompleta ou incorreta.'); }
  const until = Math.min(new Date(res.expira_em).getTime(), Date.now() + res.visualizacao_seg * 1000), shown = new Set();
  const lines = [];
  (data.campos || []).forEach((f, i) => lines.push(`<div class="row"><div class="l">${esc(f.g ? f.g + ' · ' : '')}${esc(f.l)}</div><div>${f.v.split('\n').filter(x => x.trim()).map((ln, li) => `<div class="line"><button class="vt ${f.s ? 'dots' : 'mono'}" data-f="${i}" data-l="${li}" data-s="${f.s ? 1 : 0}" data-t="${esc(ln.trim())}" data-n="${esc(f.l)}">${f.s ? '••••••••••••' : esc(ln.trim())}</button>
      <span class="acts">${f.s ? `<button class="ib" data-eye title="Mostrar/ocultar">${I('eye', 15)}</button>` : ''}<button class="ib" data-cp title="Copiar">${I('copy', 15)}</button></span></div>`).join('')}</div></div>`));
  const free = [];
  if (data.anot?.length) free.push(`<div class="card"><h4>${esc(data.anotTitulo || 'Texto')}</h4><div class="note"><div class="body">${data.anot.map(l => `<div class="ln" data-cp-text="${esc(l)}">${esc(l)}</div>`).join('')}</div></div><div class="note" style="padding-top:0"><button class="btn sm" data-cpall>${I('copy', 14)} Copiar tudo</button></div></div>`);
  if (data.nota) free.push(`<div class="card"><h4>Observações</h4><div class="note" style="white-space:pre-wrap">${esc(data.nota)}</div></div>`);
  $('#app').innerHTML = `<div class="vw"><div class="vbar"><div class="grow"><b>${esc(data.titulo)}</b><small>Acesso compartilhado pela MAP Intelligence</small></div><div class="vtimer">${I('clock', 16)}<span id="vleft"></span></div></div>
    <div class="card">${lines.join('') || '<div class="note">Sem campos.</div>'}</div>${free.join('')}
    <p class="vnote">Este acesso é temporário e pode ser cancelado a qualquer momento. Cópias feitas aqui ficam registradas.</p></div>`;
  const rep = what => SB.anon('registrar_evento_link', {p_id:id, p_campo:what}).catch(() => {});
  const copyTxt = (t, what) => { navigator.clipboard?.writeText(t).then(() => toast('Copiado')).catch(() => {}); rep(what); };
  $('#app').addEventListener('click', e => {
    const b = e.target.closest('button,.ln'); if (!b) return;
    const row = b.closest('.line');
    if (b.dataset.eye !== undefined) { const v = row.querySelector('.vt'); const on = v.classList.toggle('dots'); v.classList.toggle('mono', !on); v.textContent = on ? '••••••••••••' : v.dataset.t; }
    else if (b.dataset.cp !== undefined) { const v = row.querySelector('.vt'); copyTxt(v.dataset.t, v.dataset.n); }
    else if (b.classList.contains('vt')) copyTxt(b.dataset.t, b.dataset.n);
    else if (b.dataset.cpall !== undefined) copyTxt((data.anot || []).join('\n'), 'texto livre completo');
    else if (b.classList.contains('ln')) { const m = b.dataset.cpText.match(/[:：]\s*(\S.*)$/); copyTxt(m ? m[1].trim() : b.dataset.cpText, 'linha do texto'); }
  });
  const tick = () => { const s = Math.max(0, Math.round((until - Date.now()) / 1000)); const el = $('#vleft'); if (el) el.textContent = `Some em ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (!s) { data = null; end('O tempo de visualização terminou.', 'clock'); } };
  tick(); window._vt = setInterval(tick, 500);
  window._vp = setInterval(async () => { try { if (!(await SB.anon('status_link', {p_id:id}))) { data = null; end('O acesso foi cancelado por quem compartilhou.', 'lock'); } } catch {} }, 4000);
}

/* ---------- ações do servidor (menu, cabeçalho, painéis) ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-sv]'); if (!t) return;
  const a = t.dataset.sv, v = t.dataset.v;
  if (S.menu) { S.menu = false; if (S.unlocked) render(); }
  if (a === 'users') openUsers();
  else if (a === 'usave') saveUser(v);
  else if (a === 'logs') { logF = {tipo:$('#lt')?.value || '', busca:$('#lb')?.value || ''}; openLogs(); }
  else if (a === 'logcsv') logsCsv();
  else if (a === 'share') openShare(v);
  else if (a === 'mklink') makeLink(v);
  else if (a === 'cplink') { const u = $('#lurl'); u.select(); copy(u.value, 'Link copiado'); }
  else if (a === 'revoke') { if (!confirm('Cancelar este acesso agora? Quem estiver com o link aberto perde o acesso em segundos.')) return;
    try { await SB.rpc('revogar_link', {p_id:v}); toast('Acesso cancelado'); } catch (er) { toast(errMsg(er)); } refreshLinkList(t.dataset.r || null, t.dataset.r ? 'sh-list' : 'all-links'); }
  else if (a === 'alllinks') openAllLinks();
  else if (a === 'cfg') openCfg();
  else if (a === 'cfgsave') saveCfg();
  else if (a === 'cfgoff') { if (confirm('Voltar ao modo local (arquivo)?')) { localStorage.removeItem(CFG_LS); SB.save(null); sessionStorage.removeItem(KS); location.reload(); } }
  else if (a === 'logout') srvLogout();
  else if (a === 'impold') { const data = await legacyData(); if (!data) return toast('Não há dados antigos neste arquivo'); if (confirm(`Importar ${data.length} registros do arquivo para o servidor? Registros com o mesmo ID serão substituídos.`)) importLegacy(data).catch(er => toast(errMsg(er))); }
  else if (a === 'clean') exportClean();
  else if (a === 'ufilter') { /* tratado no input */ }
});
document.addEventListener('input', e => {
  if (e.target.dataset?.sv === 'ufilter') { const q = e.target.value.toLowerCase(); e.target.parentElement.querySelectorAll('.ugrid label').forEach(l => l.style.display = l.dataset.t.includes(q) ? '' : 'none'); }
});

async function autoUnlock() {
  for (const b of [localBlob(), embedded()].filter(Boolean).sort((x, y) => (y.ts || 0) - (x.ts || 0))) {
    try { const o = await openBlob(b, AUTO);
      Object.assign(S, {recs:o.data, key:o.key, salt:o.salt, iter:o.iter, blob:b, unlocked:true, cat:'Todos', sel:null, dirty:false}); render(); return; } catch {}
  }
  renderLock('Não foi possível abrir o cofre.');
}
if (VIEW) bootViewer(VIEW[1], VIEW[2]); else if (SERVER) bootServer(); else if (AUTO) autoUnlock(); else renderLock('');
</script>
